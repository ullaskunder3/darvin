name: Build and Release Darvin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        cache: true

    - name: Configure CMake
      # IMPORTANT: Use the MinGW bundled WITH Qt, not the runner's system mingw64.
      # Mismatched MinGW versions cause "__imp___argc undefined" at link time
      # because Qt6EntryPoint references CRT symbols from its own build toolchain.
      run: |
        $mingwPath = "${{ env.IQTA_TOOLS }}\mingw1310_64\bin"
        Write-Host "Using MinGW at: $mingwPath"
        cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja `
          -DCMAKE_C_COMPILER="$mingwPath\gcc.exe" `
          -DCMAKE_CXX_COMPILER="$mingwPath\g++.exe"

    - name: Build Darvin
      run: cmake --build build --config Release

    - name: Create Production Staging Folder
      run: |
        mkdir Darvin_Production_Test
        copy build\darvin.exe Darvin_Production_Test\
        copy darvincpp.ico Darvin_Production_Test\

    - name: Run windeployqt
      run: |
        $qtBin = "${{ env.Qt6_Dir }}\bin"
        & "$qtBin\windeployqt.exe" --no-translations Darvin_Production_Test\darvin.exe

    - name: Bundle TDM-GCC compiler for students
      run: |
        Invoke-WebRequest `
          -Uri "https://github.com/jmeubank/tdm-gcc/releases/download/v10.3.0-tdm64-2/tdm64-gcc-10.3.0-2.exe" `
          -OutFile tdmgcc_installer.exe

        # TDM-GCC uses NSIS — /S for silent, /D= sets install dir
        Start-Process -FilePath ".\tdmgcc_installer.exe" `
          -ArgumentList "/S", "/D=${{ github.workspace }}\tdm_extracted" `
          -Wait -NoNewWindow

        # Bundle only what students need to compile in Darvin
        $dest = "Darvin_Production_Test\compiler"
        mkdir $dest
        Copy-Item "${{ github.workspace }}\tdm_extracted\bin"     $dest -Recurse
        Copy-Item "${{ github.workspace }}\tdm_extracted\include" "Darvin_Production_Test\include" -Recurse -ErrorAction SilentlyContinue
        Copy-Item "${{ github.workspace }}\tdm_extracted\lib"     "Darvin_Production_Test\lib"     -Recurse -ErrorAction SilentlyContinue

    - name: Compile NSIS Installer
      run: makensis darvin_setup.nsi

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Darvin-Setup-Installer
        path: Darvin_Setup.exe