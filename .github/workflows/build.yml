name: Build and Release Darvin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        tools: 'tools_mingw1310'
        cache: true

    - name: Locate Qt MinGW and configure CMake
      run: |
        $qtRoot = Split-Path (Split-Path "${{ env.Qt6_Dir }}" -Parent) -Parent
        $gpp = Get-ChildItem -Path $qtRoot -Recurse -Filter "g++.exe" -ErrorAction SilentlyContinue |
               Where-Object { $_.FullName -match "mingw1310" } |
               Select-Object -First 1
        if (-not $gpp) { Write-Error "mingw1310 not found"; exit 1 }
        $mingwBin = $gpp.DirectoryName
        $mingwRoot = Split-Path $mingwBin -Parent   # e.g. ..\mingw1310_64
        Write-Host "Using MinGW: $mingwBin"
        echo "MINGW_BIN=$mingwBin"   >> $env:GITHUB_ENV
        echo "MINGW_ROOT=$mingwRoot" >> $env:GITHUB_ENV
        cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja `
          -DCMAKE_CXX_COMPILER="$mingwBin\g++.exe"

    - name: Build
      run: cmake --build build --config Release

    - name: Stage production folder
      run: |
        mkdir Darvin_Production_Test
        copy build\darvin.exe Darvin_Production_Test\
        copy darvincpp.ico    Darvin_Production_Test\

    - name: Run windeployqt
      run: |
        & "${{ env.Qt6_Dir }}\bin\windeployqt.exe" `
            --no-translations --no-system-d3d-compiler --no-opengl-sw `
            Darvin_Production_Test\darvin.exe

    - name: Bundle compiler (reuse mingw1310 already downloaded by Qt installer)
      # No extra download needed — mingw1310_64 is sitting right here.
      # Students need this to compile C/C++ code inside Darvin.
      # We copy only necessary folders, skipping docs/share to save space.
      run: |
        $src  = "${{ env.MINGW_ROOT }}"
        $dest = "Darvin_Production_Test\compiler"
        Write-Host "Copying compiler from: $src"
        foreach ($folder in @("bin", "include", "lib", "libexec", "x86_64-w64-mingw32", "opt")) {
          $s = Join-Path $src $folder
          $d = Join-Path $dest $folder
          if (Test-Path $s) {
            Copy-Item $s $d -Recurse
            Write-Host "Copied $folder"
          }
        }
        # Quick sanity check
        if (Test-Path "$dest\bin\g++.exe") {
          Write-Host "Compiler bundled successfully"
        } else {
          Write-Error "g++.exe not found in bundle — something went wrong"
          exit 1
        }

    - name: List staging folder
      run: Get-ChildItem Darvin_Production_Test | Format-Table Name, Length

    - name: Zip portable release
      run: Compress-Archive -Path Darvin_Production_Test\* -DestinationPath Darvin_Portable.zip

    # Upload portable zip FIRST — this is the main deliverable for students.
    # Even if the NSIS installer step below fails, students still get the zip.
    - name: Upload portable zip
      uses: actions/upload-artifact@v4
      with:
        name: Darvin-Portable
        path: Darvin_Portable.zip

    - name: Install NSIS
      run: choco install nsis --no-progress -y

    - name: Compile NSIS installer
      run: |
        & "C:\Program Files (x86)\NSIS\makensis.exe" darvin_setup.nsi

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: Darvin-Setup-Installer
        path: Darvin_Setup.exe