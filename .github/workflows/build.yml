name: Build and Release Darvin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v3
      with:
        version: '6.8.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        tools: 'tools_mingw1310'
        cache: true

    - name: Locate Qt MinGW and configure CMake
      run: |
        $qtRoot = Split-Path (Split-Path "${{ env.Qt6_Dir }}" -Parent) -Parent
        $gpp = Get-ChildItem -Path $qtRoot -Recurse -Filter "g++.exe" -ErrorAction SilentlyContinue |
               Where-Object { $_.FullName -match "mingw1310" } |
               Select-Object -First 1
        if (-not $gpp) { Write-Error "mingw1310 not found"; exit 1 }
        $mingwBin = $gpp.DirectoryName
        Write-Host "Using MinGW: $mingwBin"
        echo "MINGW_BIN=$mingwBin" >> $env:GITHUB_ENV
        cmake -B build -DCMAKE_BUILD_TYPE=Release -G Ninja `
          -DCMAKE_CXX_COMPILER="$mingwBin\g++.exe"

    - name: Build
      run: cmake --build build --config Release

    - name: Stage production folder
      run: |
        mkdir Darvin_Production_Test
        copy build\darvin.exe Darvin_Production_Test\
        copy darvincpp.ico    Darvin_Production_Test\

    - name: Run windeployqt
      run: |
        $qtBin = "${{ env.Qt6_Dir }}\bin"
        & "$qtBin\windeployqt.exe" --no-translations --no-system-d3d-compiler --no-opengl-sw Darvin_Production_Test\darvin.exe

    - name: Copy MinGW runtime DLLs
      # windeployqt already copies these, but we copy again just to be sure
      run: |
        $runtimes = @("libgcc_s_seh-1.dll", "libstdc++-6.dll", "libwinpthread-1.dll")
        foreach ($dll in $runtimes) {
          $src = Join-Path "${{ env.MINGW_BIN }}" $dll
          if (Test-Path $src) { Copy-Item $src Darvin_Production_Test\ }
        }

    - name: List staging folder
      run: Get-ChildItem Darvin_Production_Test | Format-Table Name, Length

    - name: Zip portable release
      run: Compress-Archive -Path Darvin_Production_Test\* -DestinationPath Darvin_Portable.zip

    # ── Upload portable zip NOW before installer steps can fail ────────────
    # Students can use this zip directly — unzip and double-click darvin.exe.
    - name: Upload portable zip
      uses: actions/upload-artifact@v4
      with:
        name: Darvin-Portable
        path: Darvin_Portable.zip

    # ── NSIS installer (bonus — portable zip above is the main deliverable) ─
    - name: Install NSIS
      # makensis is NOT pre-installed on windows-latest runners
      run: choco install nsis --no-progress -y

    - name: Bundle TDM-GCC for NSIS installer
      run: |
        Invoke-WebRequest `
          -Uri "https://github.com/jmeubank/tdm-gcc/releases/download/v10.3.0-tdm64-2/tdm64-gcc-10.3.0-2.exe" `
          -OutFile tdmgcc_installer.exe

        # NSIS silent install: /S flag, install dir set via registry override.
        # We use cmd.exe here because NSIS /D= requires the path WITHOUT quotes
        # and PowerShell always adds them — cmd avoids that problem.
        $installDir = "${{ github.workspace }}\tdm_extracted"
        cmd /c "tdmgcc_installer.exe /S /D=$installDir"
        Start-Sleep -Seconds 30   # Give the installer time to finish

        if (Test-Path "$installDir\bin\g++.exe") {
          Copy-Item $installDir Darvin_Production_Test\compiler -Recurse
          Write-Host "TDM-GCC bundled successfully"
        } else {
          Write-Warning "TDM-GCC extraction failed — installer will ship without bundled compiler"
        }

    - name: Compile NSIS installer
      run: |
        $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
        & $nsis darvin_setup.nsi

    - name: Upload installer
      uses: actions/upload-artifact@v4
      with:
        name: Darvin-Setup-Installer
        path: Darvin_Setup.exe